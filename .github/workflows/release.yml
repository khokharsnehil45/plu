name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: plu
            archive_name: plu-linux-x86_64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: plu
            archive_name: plu-darwin-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: plu
            archive_name: plu-darwin-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: plu.exe
            archive_name: plu-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive_name }} ${{ matrix.binary_name }}
          cd ../../..
          # Provide alias for arm64 if aarch64
          if [[ "${{ matrix.archive_name }}" == *"aarch64"* ]]; then
            cp "${{ matrix.archive_name }}" "${{ matrix.archive_name//aarch64/arm64}}"
          fi

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" -DestinationPath "${{ matrix.archive_name }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: plu-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
