[package]
name = "plu"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lopdf = "0.35"
crossbeam-channel = "0.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
crc32fast = "1.4"
byteorder = "1.5"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "plu"
path = "src/main.rs"

[lib]
name = "plu"
path = "src/lib.rs"
